[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faster-whisper-cli"
version = "0.1.0"
description = "A small command-line tool for transcribing audio with faster-whisper"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
fw-transcribe = "faster_whisper_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
